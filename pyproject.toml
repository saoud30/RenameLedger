[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "renameledger"
version = "1.0.0"
description = "Batch-rename files on Windows and keep a CSV record of every change, with one-click undo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
renameledger = "renameledger.cli:main"

[project.gui-scripts]
renameledger-gui = "renameledger.gui:run"

[tool.setuptools.packages.find]
where = ["src"]
